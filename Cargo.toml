[package]
name = "traitTest"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1.35.0",features = ["full"]}
sqlx = { version = "0.8", features = [ "runtime-tokio","mysql","chrono" ] }
anyhow = "1.0"
chrono = { version = "0.4",features = ["serde"] }
once_cell = "1.19"
jsonwebtoken = { version = "9.3.0"}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
bcrypt = "0.15"
rand = "0.8.5"